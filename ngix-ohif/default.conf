server {
      listen 8080;

      # Cabeceras de seguridad exigidas por el estandar del ecosistema Vigi.
      # always: se envian tambien en respuestas de error (4xx/5xx), no solo en 200.
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

      # NO se usa X-Frame-Options aqui: el visor OHIF se embebe en un iframe desde la app web,
      # y "DENY"/"SAMEORIGIN" romperia esa vista cuando la app esta en otro origen.
      # El control equivalente es frame-ancestors, que si permite indicar un origen concreto.
      # Reemplazar http://localhost:3000 por el origen real de la app web en produccion.
      add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000" always;

      # HSTS: activar solo cuando este proxy se sirva por HTTPS.
      # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

      location /api/pacs {
          proxy_pass         http://host.docker.internal:5025/api/pacs;
          proxy_http_version 1.1;
          proxy_set_header   Host              $http_host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
      }

      location / {
          proxy_pass         http://host.docker.internal:3001;
          proxy_http_version 1.1;
          proxy_set_header   Host              $http_host;
          proxy_set_header   Upgrade           $http_upgrade;
          proxy_set_header   Connection        "upgrade";
      }
  }